<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Produtos em Alta</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #ee4d2d;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
    }

    header p {
      margin: 0;
    }

    main {
      max-width: 700px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .painel,
    .produtos {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    .painel {
      text-align: center;
    }

    button {
      background: #ee4d2d;
      color: white;
      border: none;
      padding: 14px 20px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin: 8px 4px;
    }

    #status {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
    }

    .produto {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin-top: 12px;
    }

    .produto h3 {
      margin-top: 0;
    }

    .preco {
      font-size: 20px;
      font-weight: bold;
      color: #ee4d2d;
    }
  </style>
</head>

<body>

  <header>
    <h1>🔥 Produtos em Alta</h1>
    <p>Pesquisa para afiliados Shopee</p>
  </header>

  <main>

    <div class="painel">
      <h2>🚀 Painel do Afiliado</h2>

      <button onclick="verificarServidor()">
        VERIFICAR SERVIDOR
      </button>

      <button onclick="carregarProdutos()">
        📊 CARREGAR PRODUTOS
      </button>

      <div id="status">
        Aguardando...
      </div>
    </div>

    <div class="produtos">

      <h2>📊 Produtos</h2>

      <div id="listaProdutos">
        Nenhum produto carregado ainda.
      </div>

    </div>

  </main>

  <script>

    async function verificarServidor() {

      const status = document.getElementById("status");

      status.innerHTML = "🟡 Verificando servidor...";

      try {

        const resposta = await fetch("/api/status");

        if (!resposta.ok) {
          throw new Error("Servidor não respondeu");
        }

        const dados = await resposta.json();

        if (dados.sucesso === true) {
          status.innerHTML = "🟢 Servidor online";
        } else {
          status.innerHTML = "🔴 Servidor offline";
        }

      } catch (erro) {

        status.innerHTML = "🔴 Servidor offline";

      }

    }

    async function carregarProdutos() {

      const lista = document.getElementById("listaProdutos");

      lista.innerHTML = "🟡 Carregando produtos...";

      try {

        const resposta = await fetch("/api/produtos");

        if (!resposta.ok) {
          throw new Error("Erro ao buscar produtos");
        }

        const dados = await resposta.json();

        lista.innerHTML = "";

        if (!dados.produtos || dados.produtos.length === 0) {

          lista.innerHTML = "Nenhum produto encontrado.";

          return;
        }

        dados.produtos.forEach(produto => {

          const item = document.createElement("div");

          item.className = "produto";

          item.innerHTML = `
            <h3>${produto.nome}</h3>
            <p>Categoria: ${produto.categoria}</p>
            <p class="preco">
              R$ ${produto.preco.toFixed(2).replace(".", ",")}
            </p>
          `;

          lista.appendChild(item);

        });

      } catch (erro) {

        lista.innerHTML =
          "🔴 Não foi possível carregar os produtos.";

      }

    }

  </script>

</body>
</html>
