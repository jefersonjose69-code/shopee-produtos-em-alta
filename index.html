<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Produtos em Alta</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #ee4d2d;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
    }

    header p {
      margin: 0;
    }

    main {
      max-width: 700px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .painel {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.1);
      text-align: center;
    }

    button {
      background: #ee4d2d;
      color: white;
      border: none;
      padding: 14px 25px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 15px;
    }

    button:hover {
      opacity: 0.9;
    }

    #status {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }

    .produtos {
      margin-top: 25px;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }
  </style>
</head>

<body>

  <header>
    <h1>🔥 Produtos em Alta</h1>
    <p>Pesquisa para afiliados Shopee</p>
  </header>

  <main>

    <div class="painel">

      <h2>🚀 Painel do Afiliado</h2>

      <button onclick="verificarServidor()">
        VERIFICAR SERVIDOR
      </button>

      <div id="status">
        Aguardando...
      </div>

    </div>

    <div class="produtos">

      <h2>📊 Produtos</h2>

      <p>
        Em breve vamos colocar aqui os produtos encontrados.
      </p>

    </div>

  </main>

  <script>

    async function verificarServidor() {

      const status = document.getElementById("status");

      status.innerHTML = "🟡 Verificando servidor...";

      try {

        const resposta = await fetch("/api/status");

        if (!resposta.ok) {
          throw new Error("Servidor não respondeu corretamente");
        }

        const dados = await resposta.json();

        if (dados.sucesso === true) {

          status.innerHTML = "🟢 Servidor online";

        } else {

          status.innerHTML = "🔴 Servidor offline";

        }

      } catch (erro) {

        console.error(erro);

        status.innerHTML = "🔴 Servidor offline";

      }

    }

  </script>

</body>
</html>
